<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F4E79">
<meta name="robots" content="noindex">
<title>GBDS Cohort 2 – Check-in</title>
<style>
  :root { --navy: #1F4E79; --ink: #1d2433; --muted: #5b6474; --line: #d9dee7; --bg: #f5f7fa;
          --ok: #1e6b34; --okbg: #e3f2e7; --warn: #8a5a00; --warnbg: #fff3d6; --err: #b3261e; --errbg: #fdecea; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--ink); font-size: 16px; }
  header { background: var(--navy); color: #fff; padding: 14px 16px; }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
  main { padding: 16px; max-width: 640px; margin: 0 auto; padding-bottom: 40px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  select, input { width: 100%; font-size: 16px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; padding: 12px 0; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: 14px; color: var(--ink); }
  .seg button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .btn { display: block; width: 100%; padding: 14px; border: 0; border-radius: 8px; background: var(--navy); color: #fff; font-size: 16px; font-weight: bold; margin-top: 16px; }
  .btn:disabled { opacity: .6; }
  .btn.secondary { background: #fff; color: var(--navy); border: 1px solid var(--navy); margin-top: 8px; }
  .btn.danger { background: var(--err); }
  .actions { display: flex; gap: 8px; margin: 10px 0 4px; }
  .actions button { flex: 1; padding: 11px 6px; border: 1px dashed var(--navy); border-radius: 8px; background: #fff; color: var(--navy); font-size: 14px; font-weight: bold; }
  .links { display: flex; gap: 16px; justify-content: center; margin-top: 12px; }
  .links a { color: var(--navy); font-size: 14px; }
  .msg { padding: 10px 12px; border-radius: 8px; margin: 12px 0 0; font-size: 14px; }
  .msg.err { background: var(--errbg); color: var(--err); }
  .msg.ok { background: var(--okbg); color: var(--ok); }
  .msg.warn { background: var(--warnbg); color: var(--warn); }
  .msg button { margin-top: 8px; padding: 8px 12px; border-radius: 6px; border: 1px solid currentColor; background: #fff; color: inherit; font-size: 14px; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .bar a { color: var(--navy); white-space: nowrap; }
  .tabs { display: flex; gap: 6px; margin: 10px 0; }
  .tabs button { flex: 1; padding: 8px 4px; border: 1px solid var(--line); background: #fff; border-radius: 16px; font-size: 13px; color: var(--ink); }
  .tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .card { width: 100%; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 8px;
          display: flex; justify-content: space-between; gap: 10px; align-items: center; font: inherit; color: inherit; }
  .card .n { font-weight: bold; }
  .card .d { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .chip { font-size: 12px; padding: 4px 8px; border-radius: 12px; white-space: nowrap; }
  .chip.in { background: var(--okbg); color: var(--ok); }
  .chip.out { background: #eef1f5; color: var(--muted); }
  .hint { font-size: 13px; color: var(--muted); }
  .hint a { color: var(--navy); }
  .backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, .35); }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); max-height: 90vh; overflow-y: auto;
           box-shadow: 0 -8px 24px rgba(0,0,0,.15); padding: 16px 16px 20px; border-radius: 14px 14px 0 0; max-width: 640px; margin: 0 auto; }
  .sheet h2 { margin: 0 0 8px; font-size: 19px; }
  .detail div { padding: 5px 0; border-bottom: 1px solid #eef1f5; font-size: 15px; }
  .detail span { display: inline-block; min-width: 110px; color: var(--muted); }
  .tr { margin: 12px 0 4px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fbfcfe; }
  .tr h3 { margin: 0 0 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .pay { padding: 9px 0; border-top: 1px solid #eef1f5; font-size: 15px; }
  .tr h3 + .pay, .sheetlist .pay:first-child { border-top: 0; }
  .pay .d { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .pay a { font-size: 13px; color: var(--navy); display: inline-block; margin-top: 4px; }
  .ans { font-size: 13px; margin-top: 4px; }
  .ans.yes { color: var(--ok); }
  .ans.no { color: var(--err); }
  .two { display: flex; gap: 8px; margin-top: 8px; }
  .two button { flex: 1; padding: 10px 6px; border-radius: 8px; border: 1px solid var(--ok); background: #fff; color: var(--ok); font-size: 14px; font-weight: bold; }
  .two button.no { border-color: var(--err); color: var(--err); }
  .two button:disabled { opacity: .6; }
  .trbtn { display: block; width: 100%; margin: 2px 0 10px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); font-size: 14px; text-align: left; }
  .trbtn b { color: var(--warn); }
  .flag { color: var(--warn); font-weight: bold; }
  .ver { font-size: 12px; text-align: center; margin-top: 24px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>GBDS Cohort 2 – Check-in</h1>
  <p id="sub">Register, check in and correct attendance</p>
</header>
<main>
  <section id="start">
    <label for="cluster">Cluster</label>
    <select id="cluster"></select>
    <label for="pin">Cluster PIN</label>
    <input id="pin" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="6 digits">
    <label for="trainer">Your name</label>
    <input id="trainer" autocomplete="name" placeholder="Lead trainer or co-trainer">
    <label>Today's training day</label>
    <div class="seg" id="days"></div>
    <button class="btn" id="open" type="button">Open check-in</button>
    <div id="startMsg"></div>
    <p class="hint ver" id="ver"></p>
  </section>

  <section id="main" class="hidden">
    <div class="bar"><span id="where"></span><a href="#" id="change">Change</a></div>
    <div class="bar"><span id="counts"></span><a href="#" id="refresh">Refresh list</a></div>
    <div class="actions">
      <button type="button" id="addPerson">+ Register new participant</button>
      <button type="button" id="addGuest">+ Add guest</button>
    </div>
    <button type="button" id="trBtn" class="trbtn hidden">Transport payments</button>
    <input id="q" type="search" placeholder="Type a name, ID or phone number" autocomplete="off">
    <div class="tabs">
      <button type="button" data-f="all" class="on">All</button>
      <button type="button" data-f="out">Not yet in</button>
      <button type="button" data-f="in">Checked in</button>
    </div>
    <div id="flash"></div>
    <div id="list"></div>
    <p class="hint">If this page is not working, use the <a id="formLink" target="_blank" href="#">back-up form</a>.</p>
    <p class="hint ver" id="ver2"></p>
  </section>
</main>

<div id="backdrop" class="backdrop hidden"></div>
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
  <div id="sheetBody"></div>
</div>

<script>window.BOOT = {"api":"https://script.google.com/macros/s/AKfycby8nyADcS7QrHgdgpkqUz-b5zJzTu0aQZsPeaLZwPOJ7FSMICkEmLf7lfb37tv7ao6HUg/exec","standalone":true};</script>
<script>
(function () {
  var B = window.BOOT || { clusters: [], cluster: '', days: [], guestRoles: [] };
  var S = { cluster: '', pin: '', trainer: '', day: 0, people: [], guests: 0, filter: 'all', busy: false, route: '' };

  function $(id) { return document.getElementById(id); }
  function each(list, fn) { Array.prototype.forEach.call(list, fn); }
  function store(k, v) { try { localStorage.setItem('gbds_' + k, v); } catch (e) { /* storage unavailable */ } }
  function load(k) { try { return localStorage.getItem('gbds_' + k) || ''; } catch (e) { return ''; } }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function msgHtml(kind, text) { return text ? '<div class="msg ' + kind + '">' + esc(text) + '</div>' : ''; }
  function msg(id, kind, text) { $(id).innerHTML = msgHtml(kind, text); }
  // Two ways to reach the script. 'post' sends a plain request to the page's /exec link without Google sign-in
  // cookies, so it works in browsers signed in to several Google accounts. 'run' is google.script.run, which
  // Google breaks in such browsers. Opening or refreshing the list (read only) tries 'post' first and falls
  // back to 'run'; saves then use whichever worked, so nothing is ever sent twice.
  function viaPost(fn, args) {
    return fetch(B.api, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }), credentials: 'omit', cache: 'no-store', redirect: 'follow' })
      .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(function (r) { if (!r || typeof r !== 'object') throw new Error('Unexpected reply'); return r; });
  }
  function viaRun(fn, args, ok, fail) {
    try {
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { fail(e); });
      r[fn].apply(r, args);
    } catch (e) { fail(e); }
  }
  function friendly(e) {
    var m = String(e && e.message ? e.message : e);
    if (/PERMISSION_DENIED|reading from storage|Authorization is required|multiple accounts/i.test(m)) {
      return 'This browser is signed in to more than one Google account, and Google blocks the page. Open the link in a private (incognito) window, or sign out of the other Google accounts in this browser.';
    }
    if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return 'Could not reach the attendance system. Check the internet connection and try again.';
    if (/^HTTP \d|Unexpected (reply|token|end)|JSON/i.test(m)) return 'The attendance system did not answer properly (' + m + '). Try again; if it keeps happening, use the back-up form and tell the programme manager.';
    return m;
  }
  function call(fn, args, ok, fail) {
    var done = function (r) { setTimeout(function () { ok(r); }, 0); };   // keeps page errors out of the fallback
    var failed = function (e) { fail(friendly(e)); };
    if (B.standalone) return viaPost(fn, args).then(done, failed);       // hosted copy: the direct route only
    var probe = fn === 'checkinUnlock';
    var route = probe ? '' : (S.route || (B.api ? 'post' : 'run'));
    if (route === 'run' || ((probe || !route) && !(B.api && window.fetch))) {
      if (probe) S.route = 'run';
      return viaRun(fn, args, done, failed);
    }
    if (route === 'post') return viaPost(fn, args).then(done, failed);
    viaPost(fn, args).then(function (r) { S.route = 'post'; done(r); }, function () {
      S.route = 'run';
      viaRun(fn, args, done, failed);
    });
  }
  function digits(s) { return String(s || '').replace(/\D/g, ''); }

  // ---------- start screen ----------
  // Served by Google, the cluster list arrives with the page. The hosted copy asks the script for it.
  function urlCluster() {
    var m = /[?&]c=([^&#]*)/.exec(window.location.search || '');
    try { return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : ''; } catch (e) { return ''; }
  }
  // Which copy of the page and of the script is running (they should match after an update).
  var PAGE_VERSION = '2.6.3';
  function showVersion() {
    var t = 'Check-in page ' + PAGE_VERSION + (B.version ? ' · system ' + B.version : '');
    $('ver').textContent = t; $('ver2').textContent = t;
  }
  showVersion();
  function fillStart() {
    $('cluster').innerHTML = '<option value="">Choose your cluster</option>' +
      B.clusters.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('');
    var want = B.cluster || urlCluster() || load('cluster');
    $('cluster').value = B.clusters.indexOf(want) >= 0 ? want : '';
    $('days').innerHTML = B.days.map(function (d, i) { return '<button type="button" data-v="' + (i + 1) + '">' + esc(d) + '</button>'; }).join('');
    segBind($('days'), function (v) { S.day = Number(v); });
    $('open').disabled = false;
    msg('startMsg', '', '');
  }
  function boot() {
    $('cluster').innerHTML = '<option value="">Loading clusters…</option>';
    $('open').disabled = true;
    msg('startMsg', 'warn', 'Connecting to the attendance system…');
    call('checkinBoot', [], function (r) {
      if (!r || !r.ok || !r.clusters) return bootFailed((r && r.message) || 'The cluster list could not be loaded.');
      B.clusters = r.clusters; B.days = r.days; B.guestRoles = r.guestRoles; B.version = r.version || '';
      showVersion();
      fillStart();
    }, bootFailed);
  }
  function bootFailed(text) {
    $('cluster').innerHTML = '<option value="">Not loaded</option>';
    $('startMsg').innerHTML = msgHtml('err', text);
    $('startMsg').firstChild.insertAdjacentHTML('beforeend', '<br><button type="button" id="retry">Try again</button>');
    $('retry').onclick = boot;
  }
  $('trainer').value = load('trainer');
  if (B.clusters && B.days) fillStart(); else boot();

  function segBind(el, onPick) {
    each(el.querySelectorAll('button'), function (b) {
      b.onclick = function () {
        each(el.querySelectorAll('button'), function (x) { x.className = x === b ? 'on' : ''; });
        el.setAttribute('data-value', b.getAttribute('data-v'));
        if (onPick) onPick(b.getAttribute('data-v'));
      };
    });
  }
  function segValue(id) { return $(id).getAttribute('data-value') || ''; }

  $('open').onclick = function () {
    var c = $('cluster').value, p = $('pin').value.trim(), t = $('trainer').value.trim();
    if (!c) return msg('startMsg', 'err', 'Choose your cluster.');
    if (!/^\d{6}$/.test(p)) return msg('startMsg', 'err', 'Enter the 6-digit cluster PIN.');
    if (!t) return msg('startMsg', 'err', 'Enter your name.');
    if (!S.day) return msg('startMsg', 'err', 'Choose today\'s training day.');
    msg('startMsg', 'warn', 'Opening…');
    $('open').disabled = true;
    call('checkinUnlock', [c, p, S.day], function (r) {
      $('open').disabled = false;
      if (!r || !r.ok) return msg('startMsg', 'err', (r && r.message) || 'Could not open the list.');
      S.cluster = c; S.pin = p; S.trainer = t; S.people = r.participants || []; S.guests = r.guests || 0;
      store('cluster', c); store('trainer', t);
      $('formLink').href = r.formLink || '#';
      msg('startMsg', '', '');
      $('start').classList.add('hidden');
      $('main').classList.remove('hidden');
      $('where').textContent = c + ' · Day ' + S.day;
      $('sub').textContent = 'Day ' + S.day + ' · ' + t;
      render();
    }, function (e) { $('open').disabled = false; msg('startMsg', 'err', e); });
  };

  $('change').onclick = function (ev) { ev.preventDefault(); $('main').classList.add('hidden'); $('start').classList.remove('hidden'); };
  $('refresh').onclick = function (ev) {
    ev.preventDefault();
    msg('flash', 'warn', 'Refreshing…');
    call('checkinUnlock', [S.cluster, S.pin, S.day], function (r) {
      if (!r || !r.ok) return msg('flash', 'err', (r && r.message) || 'Could not refresh.');
      S.people = r.participants || []; S.guests = r.guests || 0;
      msg('flash', 'ok', 'List refreshed: ' + S.people.length + ' registered.');
      render();
    }, function (e) { msg('flash', 'err', e); });
  };
  each(document.querySelectorAll('.tabs button'), function (b) {
    b.onclick = function () {
      S.filter = b.getAttribute('data-f');
      each(document.querySelectorAll('.tabs button'), function (x) { x.className = x === b ? 'on' : ''; });
      render();
    };
  });
  $('q').oninput = render;
  $('addPerson').onclick = function () { openRegister(); };
  $('addGuest').onclick = function () { openGuest(); };
  $('trBtn').onclick = function () { openTransportList(); };

  // ---------- list ----------
  // Digits match the ID or phone (3+ digits, with or without the leading 0); words match the start of name parts.
  function matches(p, q) {
    if (!q) return true;
    var d = digits(q);
    if (d.length >= 3) {
      if (digits(p.id).indexOf(d) >= 0) return true;
      var ph = digits(p.phone), d2 = d.replace(/^0+/, '').replace(/^254/, '');
      if (ph.indexOf(d) >= 0 || (d2.length >= 3 && ph.indexOf(d2) >= 0)) return true;
    }
    var words = q.toLowerCase().replace(/[^a-z\s]/g, ' ').split(/\s+/).filter(Boolean);
    if (!words.length) return false;
    var parts = String(p.name).toLowerCase().split(/\s+/);
    return words.every(function (w) { return parts.some(function (n) { return n.indexOf(w) === 0; }); });
  }
  function isIn(p) { return !!(p.days && p.days[S.day]); }
  function daysIn(p) { return Object.keys(p.days || {}).map(Number).sort(); }

  function render() {
    var q = $('q').value.trim();
    var inCount = S.people.filter(isIn).length;
    $('counts').textContent = inCount + ' of ' + S.people.length + ' registered checked in for Day ' + S.day + (S.guests ? ' · ' + S.guests + ' guest' + (S.guests > 1 ? 's' : '') : '');
    S.hasPay = S.people.some(function (p) { return p.pay && p.pay.length; });
    var waiting = S.people.reduce(function (n, p) { return n + toConfirm(p).length; }, 0);
    $('trBtn').classList.toggle('hidden', !S.hasPay);
    $('trBtn').innerHTML = 'Transport payments · ' + (waiting ? '<b>' + waiting + ' to confirm</b>' : 'all answered');
    var list = S.people.filter(function (p) {
      return matches(p, q) && (S.filter === 'all' || (S.filter === 'in') === isIn(p));
    }).sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); });
    if (!list.length) {
      $('list').innerHTML = '<p class="hint">' + (S.people.length ? 'No one matches. Check the spelling or number, or register them as a new participant.' : 'No one is registered for this cluster yet. Tap "Register new participant".') + '</p>';
      return;
    }
    $('list').innerHTML = list.slice(0, 80).map(function (p, i) {
      var chip = isIn(p) ? '<span class="chip in">In ' + esc(p.days[S.day]) + '</span>' : '<span class="chip out">Not yet</span>';
      return '<button type="button" class="card" data-i="' + i + '"><div><div class="n">' + esc(p.name) + '</div>' +
        '<div class="d">ID ' + esc(p.id) + ' · ' + esc(p.phone) + '</div>' +
        '<div class="d">' + esc(p.sex) + ' · ' + esc(p.ageGroup) + (p.pwd === 'Yes' ? ' · PWD' : '') +
        (toConfirm(p).length ? ' · <span class="flag">transport to confirm</span>' : '') + '</div></div>' + chip + '</button>';
    }).join('');
    each($('list').querySelectorAll('.card'), function (el) {
      el.onclick = function () { openPerson(list[Number(el.getAttribute('data-i'))]); };
    });
  }

  // ---------- panels ----------
  function showSheet(html) {
    $('sheetBody').innerHTML = html;
    $('sheet').classList.remove('hidden');
    $('backdrop').classList.remove('hidden');
    $('sheet').scrollTop = 0;
  }
  function closeSheet() { $('sheet').classList.add('hidden'); $('backdrop').classList.add('hidden'); S.busy = false; }
  $('backdrop').onclick = function () { if (!S.busy) closeSheet(); };
  // An error message disappears as soon as the trainer types or taps a choice to fix it.
  function clearErr() { each($('sheetBody').querySelectorAll('.msg.err'), function (el) { el.parentNode.removeChild(el); }); }
  $('sheetBody').addEventListener('input', clearErr);
  $('sheetBody').addEventListener('click', function (ev) { if (ev.target.closest && ev.target.closest('.seg')) clearErr(); });
  function busy(btnId, text) { S.busy = true; $(btnId).disabled = true; $(btnId).textContent = text; }
  function done(btnId, text) { S.busy = false; if ($(btnId)) { $(btnId).disabled = false; $(btnId).textContent = text; } }
  function field(id, label, value, attrs) { return '<label for="' + id + '">' + esc(label) + '</label><input id="' + id + '" value="' + esc(value || '') + '" ' + (attrs || '') + '>'; }
  function seg(id, label, options, value) {
    return '<label>' + esc(label) + '</label><div class="seg" id="' + id + '"' + (value ? ' data-value="' + esc(value) + '"' : '') + '>' +
      options.map(function (o) { return '<button type="button" data-v="' + esc(o) + '"' + (o === value ? ' class="on"' : '') + '>' + esc(o) + '</button>'; }).join('') + '</div>';
  }
  function upsert(p) {
    if (!p) return;
    var i = S.people.map(function (x) { return x.id; }).indexOf(p.id);
    if (i >= 0) S.people[i] = p; else S.people.push(p);
  }

  // Person: details, check in, and links to correct
  function openPerson(p) {
    var inDays = daysIn(p);
    showSheet('<h2>' + esc(p.name) + '</h2><div class="detail">' +
      '<div><span>National ID</span>' + esc(p.id) + '</div>' +
      '<div><span>Phone</span>' + esc(p.phone) + '</div>' +
      '<div><span>Sex</span>' + esc(p.sex) + '</div>' +
      '<div><span>Age</span>' + esc(p.age) + ' (' + esc(p.ageGroup) + ')</div>' +
      '<div><span>Disability</span>' + esc(p.pwd) + '</div>' +
      '<div><span>Days attended</span>' + (inDays.length ? inDays.map(function (d) { return 'Day ' + d + ' (' + esc(p.days[d]) + ')'; }).join(', ') : 'None') + '</div></div>' +
      transportBlock(p) +
      (isIn(p) ? msgHtml('warn', 'Already checked in for Day ' + S.day + ' at ' + p.days[S.day] + '.') : '') +
      (isIn(p) ? '' : '<button class="btn" id="go" type="button">Confirm check-in for Day ' + S.day + '</button>') +
      '<button class="btn secondary" id="close" type="button">' + (isIn(p) ? 'Close' : 'Cancel') + '</button>' +
      '<div class="links"><a href="#" id="fix">Fix details</a>' + (inDays.length ? '<a href="#" id="undo">Cancel a check-in</a>' : '') + '</div>');
    $('close').onclick = closeSheet;
    bindPay(p, $('sheetBody'), function () { openPerson(p); });
    $('fix').onclick = function (ev) { ev.preventDefault(); openFix(p); };
    if ($('undo')) $('undo').onclick = function (ev) { ev.preventDefault(); openCancel(p); };
    if (!$('go')) return;
    $('go').onclick = function () {
      if (S.busy) return;
      busy('go', 'Saving…');
      call('checkinConfirm', [S.cluster, S.pin, S.day, p.id, S.trainer], function (r) {
        closeSheet();
        if (!r || !r.ok) return msg('flash', 'err', (r && r.message) || 'Not saved. Try again.');
        p.days = p.days || {};
        p.days[S.day] = r.time;
        msg('flash', r.already ? 'warn' : 'ok', r.already ? r.name + ' was already checked in at ' + r.time + '.' : r.name + ' checked in at ' + r.time + '.');
        $('q').value = '';
        render();
      }, function (e) { done('go', 'Confirm check-in for Day ' + S.day); msg('flash', 'err', 'Not saved: ' + e); });
    };
  }

  // ---------- transport ----------
  // Each payment sent by M-PESA is confirmed with the participant: Received, or Not received with the reason.
  function money(n) { return 'KES ' + Number(n || 0).toLocaleString('en-KE'); }
  function payDays(x) { return (x.days.length > 1 ? 'Days ' : 'Day ') + x.days.join(', '); }
  function toConfirm(p) { return (p.pay || []).filter(function (x) { return x.status === 'sent' && !x.answer; }); }
  function answerButtons(key, hidden) {
    return '<div class="two' + (hidden ? ' hidden' : '') + '" data-two="' + key + '"><button type="button" data-pay="' + key + '" data-a="Received">Received</button>' +
      '<button type="button" class="no" data-pay="' + key + '" data-a="Not received">Not received</button></div>';
  }
  function payLine(x, key) {
    var h = '<div class="pay"><b>' + payDays(x) + '</b> · ' + money(x.amount);
    if (x.status === 'listed') return h + '<div class="d">Being paid – waiting for the M-PESA results</div></div>';
    if (x.status === 'failed') return h + '<div class="d">The payment failed – it will be sent again</div></div>';
    h += '<div class="d">Sent ' + esc(x.at) + ' · M-PESA ' + esc(x.receipt) + '</div>';
    if (x.answer) {
      h += '<div class="ans ' + (x.answer === 'Received' ? 'yes">✓ Received' : 'no">✗ Not received: ' + esc(x.reason)) +
        ' <span class="d">(' + esc(x.answeredBy) + ', ' + esc(x.answeredAt) + ')</span></div><a href="#" data-change="' + key + '">Change answer</a>';
    }
    return h + answerButtons(key, !!x.answer) + '</div>';
  }
  function transportBlock(p) {
    if (!S.hasPay) return '';
    var pays = p.pay || [], paid = {};
    pays.forEach(function (x) { x.days.forEach(function (d) { paid[d] = true; }); });
    var unpaid = daysIn(p).filter(function (d) { return !paid[d]; });
    if (!pays.length && !unpaid.length) return '';
    return '<div class="tr"><h3>Transport – did the M-PESA arrive?</h3>' + pays.map(function (x, i) { return payLine(x, i); }).join('') +
      (unpaid.length ? '<div class="pay"><span class="d">Not paid yet: ' + unpaid.map(function (d) { return 'Day ' + d; }).join(', ') + '</span></div>' : '') + '</div>';
  }
  function bindPay(p, root, back, pick) {
    pick = pick || function (key) { return { p: p, x: p.pay[Number(key)] }; };
    each(root.querySelectorAll('[data-pay]'), function (b) {
      b.onclick = function () {
        var o = pick(b.getAttribute('data-pay'));
        if (b.getAttribute('data-a') === 'Received') answerPay(o.p, o.x, 'Received', '', back, b);
        else openNotReceived(o.p, o.x, back);
      };
    });
    each(root.querySelectorAll('[data-change]'), function (a) {
      a.onclick = function (ev) {
        ev.preventDefault();
        root.querySelector('[data-two="' + a.getAttribute('data-change') + '"]').classList.remove('hidden');
        a.classList.add('hidden');
      };
    });
  }
  function answerPay(p, x, answer, reason, back, btn) {
    if (S.busy) return;
    S.busy = true;
    if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
    call('checkinTransport', [S.cluster, S.pin, S.day, p.id, x.receipt, answer, reason, S.trainer], function (r) {
      S.busy = false;
      var ok = !!(r && r.ok);
      if (ok) p.pay = r.pay || p.pay;
      render();
      back();
      $('sheetBody').insertAdjacentHTML('afterbegin', msgHtml(ok ? (answer === 'Received' ? 'ok' : 'warn') : 'err', ok
        ? p.name + ', ' + payDays(x) + ': ' + (answer === 'Received' ? 'received.' : 'not received – recorded for the office to follow up.')
        : (r && r.message) || 'Not saved. Try again.'));
    }, function (e) {
      S.busy = false;
      back();
      $('sheetBody').insertAdjacentHTML('afterbegin', msgHtml('err', 'Not saved: ' + e));
    });
  }
  function openNotReceived(p, x, back) {
    var reasons = B.notReceived || ['No M-PESA message received', 'Amount received is different', 'Sent to a different number', 'Other'];
    showSheet('<h2>Not received – ' + esc(p.name) + '</h2>' +
      '<p class="hint">' + payDays(x) + ' · ' + money(x.amount) + ' · sent ' + esc(x.at) + ' · M-PESA ' + esc(x.receipt) + '. Ask the participant to check their M-PESA messages first.</p>' +
      '<label for="nrWhy">What is the problem?</label><select id="nrWhy"><option value="">Choose</option>' +
      reasons.map(function (r) { return '<option>' + esc(r) + '</option>'; }).join('') + '</select>' +
      field('nrNote', 'Details (the number it went to, the amount received…)', '', 'autocomplete="off"') +
      '<div id="nrMsg"></div>' +
      '<button class="btn danger" id="nrGo" type="button">Record: not received</button>' +
      '<button class="btn secondary" id="nrBack" type="button">Back</button>');
    $('nrBack').onclick = back;
    $('nrGo').onclick = function () {
      var why = $('nrWhy').value, note = $('nrNote').value.trim();
      if (!why) return msg('nrMsg', 'err', 'Choose the problem.');
      if (why === 'Other' && !note) return msg('nrMsg', 'err', 'Describe the problem.');
      answerPay(p, x, 'Not received', why + (note ? ': ' + note : ''), back, $('nrGo'));
    };
  }
  // Everyone in the cluster with a payment still to confirm
  function openTransportList() {
    var rows = [], n = { received: 0, not: 0, listed: 0, failed: 0 };
    S.people.forEach(function (p) {
      (p.pay || []).forEach(function (x) {
        if (x.status === 'listed') n.listed++;
        else if (x.status === 'failed') n.failed++;
        else if (x.answer === 'Received') n.received++;
        else if (x.answer) n.not++;
        else rows.push({ p: p, x: x });
      });
    });
    rows.sort(function (a, b) { return String(a.p.name).localeCompare(String(b.p.name)) || a.x.days[0] - b.x.days[0]; });
    showSheet('<h2>Transport payments</h2><p class="hint">Ask each participant whether the M-PESA payment arrived, then tap their answer.</p>' +
      '<div class="detail"><div><span>To confirm</span>' + rows.length + '</div><div><span>Received</span>' + n.received + '</div>' +
      '<div><span>Not received</span>' + n.not + '</div>' + (n.listed ? '<div><span>Being paid</span>' + n.listed + '</div>' : '') +
      (n.failed ? '<div><span>To resend</span>' + n.failed + '</div>' : '') + '</div>' +
      '<div class="sheetlist">' + rows.map(function (o, k) {
        return '<div class="pay"><b>' + esc(o.p.name) + '</b><div class="d">' + payDays(o.x) + ' · ' + money(o.x.amount) + ' · sent ' + esc(o.x.at) +
          ' · ' + esc(o.x.receipt) + '</div>' + answerButtons(k, false) + '</div>';
      }).join('') + '</div>' +
      (rows.length ? '' : msgHtml('ok', 'Every payment sent so far has an answer.')) +
      '<button class="btn secondary" id="trClose" type="button">Close</button>');
    $('trClose').onclick = closeSheet;
    bindPay(null, $('sheetBody'), openTransportList, function (k) { return rows[Number(k)]; });
  }

  // Register a participant attending for the first time
  function openRegister(force) {
    showSheet('<h2>Register new participant</h2>' +
      '<p class="hint">For someone attending for the first time. Copy the details exactly as on the National ID. They are checked in for Day ' + S.day + '.</p>' +
      field('rName', 'Full name as on National ID', '', 'autocomplete="off"') +
      field('rId', 'National ID number', '', 'inputmode="numeric" autocomplete="off"') +
      field('rPhone', 'Phone number (for M-PESA)', '', 'inputmode="tel" autocomplete="off" placeholder="0712345678"') +
      seg('rSex', 'Sex', ['Male', 'Female']) +
      field('rAge', 'Age in years', '', 'inputmode="numeric" autocomplete="off" maxlength="2"') +
      seg('rPwd', 'Person with disability?', ['Yes', 'No']) +
      '<div id="rMsg"></div>' +
      '<button class="btn" id="rGo" type="button">Register and check in for Day ' + S.day + '</button>' +
      '<button class="btn secondary" id="rClose" type="button">Cancel</button>' +
      '<p class="hint">Read the data protection notice at registration. Only photograph participants who agree.</p>');
    segBind($('rSex')); segBind($('rPwd'));
    $('rClose').onclick = closeSheet;
    $('rGo').onclick = function () { submitRegister(false); };
  }
  function regData() {
    return { name: $('rName').value.trim(), id: digits($('rId').value), phone: $('rPhone').value.replace(/\s/g, ''),
             sex: segValue('rSex'), age: $('rAge').value.trim(), pwd: segValue('rPwd') };
  }
  function checkDetails(d) {
    if (d.name.split(/\s+/).filter(Boolean).length < 2) return 'Enter the full name as on the National ID (at least two names).';
    if (!/^\d{6,10}$/.test(d.id)) return 'The National ID should be 6 to 10 digits.';
    if (!/^(\+254|0)\d{9}$/.test(d.phone)) return 'Enter a phone number like 0712345678 or +254712345678.';
    if (!d.sex) return 'Choose the sex.';
    if (!/^\d{2}$/.test(d.age)) return 'Enter the age in whole years.';
    if (Number(d.age) < 18) return 'Participants must be 18 or older. Under-18s cannot be registered.';
    if (!d.pwd) return 'Choose whether the participant has a disability.';
    return '';
  }
  function submitRegister(force) {
    if (S.busy) return;
    var d = regData(), err = checkDetails(d);
    if (err) return msg('rMsg', 'err', err);
    busy('rGo', 'Saving…');
    call('checkinRegister', [S.cluster, S.pin, S.day, d, S.trainer, !!force], function (r) {
      done('rGo', 'Register and check in for Day ' + S.day);
      if (r && r.ok) {
        closeSheet();
        upsert(r.participant);
        msg('flash', 'ok', d.name + ' registered and checked in at ' + r.time + '.');
        render();
        return;
      }
      if (r && r.code === 'exists') {
        $('rMsg').innerHTML = msgHtml('warn', r.message) + '';
        var person = S.people.filter(function (x) { return x.id === r.id; })[0];
        if (person) {
          $('rMsg').firstChild.insertAdjacentHTML('beforeend', '<br><button type="button" id="rOpen">Open ' + esc(person.name) + '</button>');
          $('rOpen').onclick = function () { openPerson(person); };
        }
        return;
      }
      if (r && r.code === 'otherCluster') {
        $('rMsg').innerHTML = msgHtml('warn', r.message);
        $('rMsg').firstChild.insertAdjacentHTML('beforeend', '<br><button type="button" id="rForce">Register here anyway</button>');
        $('rForce').onclick = function () { submitRegister(true); };
        return;
      }
      msg('rMsg', 'err', (r && r.message) || 'Not saved. Try again.');
    }, function (e) { done('rGo', 'Register and check in for Day ' + S.day); msg('rMsg', 'err', 'Not saved: ' + e); });
  }

  // Guests and officials
  function openGuest() {
    showSheet('<h2>Add a guest or official</h2><p class="hint">People attending who are not cluster participants. They count towards catering, not attendance.</p>' +
      field('gName', 'Full name', '', 'autocomplete="off"') +
      field('gOrg', 'Organisation and designation', '', 'autocomplete="off" placeholder="e.g. MSEA, Kisii County Government"') +
      '<label for="gRole">Role at the training</label><select id="gRole"><option value="">Choose</option>' +
      (B.guestRoles || []).map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('') + '</select>' +
      '<div id="gMsg"></div>' +
      '<button class="btn" id="gGo" type="button">Add guest for Day ' + S.day + '</button>' +
      '<button class="btn secondary" id="gClose" type="button">Cancel</button>');
    $('gClose').onclick = closeSheet;
    $('gGo').onclick = function () {
      if (S.busy) return;
      var g = { name: $('gName').value.trim(), org: $('gOrg').value.trim(), role: $('gRole').value };
      if (!g.name || !g.org || !g.role) return msg('gMsg', 'err', 'Enter the name, organisation and role.');
      busy('gGo', 'Saving…');
      call('checkinGuest', [S.cluster, S.pin, S.day, g, S.trainer], function (r) {
        done('gGo', 'Add guest for Day ' + S.day);
        if (!r || !r.ok) return msg('gMsg', 'err', (r && r.message) || 'Not saved.');
        closeSheet();
        S.guests = r.guests;
        msg('flash', 'ok', g.name + ' added as a guest.');
        render();
      }, function (e) { done('gGo', 'Add guest for Day ' + S.day); msg('gMsg', 'err', 'Not saved: ' + e); });
    };
  }

  // Fix details: only changed fields are sent; the correction applies to every day already recorded
  function openFix(p) {
    showSheet('<h2>Fix details – ' + esc(p.name) + '</h2><p class="hint">Change only what is wrong. The correction applies to every day already recorded and is logged with your name.</p>' +
      field('fName', 'Full name as on National ID', p.name, 'autocomplete="off"') +
      field('fId', 'National ID number', p.id, 'inputmode="numeric" autocomplete="off"') +
      field('fPhone', 'Phone number', p.phone, 'inputmode="tel" autocomplete="off"') +
      seg('fSex', 'Sex', ['Male', 'Female'], p.sex) +
      field('fAge', 'Age in years', p.age, 'inputmode="numeric" autocomplete="off" maxlength="2"') +
      seg('fPwd', 'Person with disability?', ['Yes', 'No'], p.pwd) +
      field('fWhy', 'What was wrong?', '', 'autocomplete="off" placeholder="e.g. ID typed wrongly on Day 1"') +
      '<div id="fMsg"></div>' +
      '<button class="btn" id="fGo" type="button">Save correction</button>' +
      '<button class="btn secondary" id="fClose" type="button">Cancel</button>');
    segBind($('fSex')); segBind($('fPwd'));
    $('fClose').onclick = closeSheet;
    $('fGo').onclick = function () {
      if (S.busy) return;
      var now = { name: $('fName').value.trim(), id: digits($('fId').value), phone: $('fPhone').value.replace(/\s/g, ''),
                  sex: segValue('fSex'), age: $('fAge').value.trim(), pwd: segValue('fPwd') };
      var err = checkDetails(now);
      if (err) return msg('fMsg', 'err', err);
      var c = {}, changed = false;
      ['name', 'id', 'phone', 'sex', 'age', 'pwd'].forEach(function (k) {
        if (String(now[k]) !== String(p[k])) { c[k] = now[k]; changed = true; }
      });
      if (!changed) return msg('fMsg', 'warn', 'Nothing has been changed.');
      c.reason = $('fWhy').value.trim();
      if (!c.reason) return msg('fMsg', 'err', 'Say what was wrong.');
      busy('fGo', 'Saving – this can take a few seconds…');
      call('checkinFix', [S.cluster, S.pin, S.day, p.id, c, S.trainer], function (r) {
        done('fGo', 'Save correction');
        if (!r || !r.ok) return msg('fMsg', 'err', (r && r.message) || 'Not saved.');
        closeSheet();
        S.people = r.participants || S.people;
        msg('flash', r.applied ? 'ok' : 'warn', r.applied ? 'Correction saved. ' + r.change : r.result + (r.change ? ' – ' + r.change : ''));
        render();
      }, function (e) { done('fGo', 'Save correction'); msg('fMsg', 'err', 'Not saved: ' + e); });
    };
  }

  // Cancel a check-in made in error (wrong person, day or cluster)
  function openCancel(p) {
    var inDays = daysIn(p);
    showSheet('<h2>Cancel a check-in – ' + esc(p.name) + '</h2><p class="hint">For a check-in recorded for the wrong person, on the wrong day or under the wrong cluster. It stays in the records, marked as cancelled.</p>' +
      seg('cDay', 'Which check-in?', inDays.map(function (d) { return 'Day ' + d; }), inDays.length === 1 ? 'Day ' + inDays[0] : '') +
      field('cWhy', 'Why is it being cancelled?', '', 'autocomplete="off" placeholder="e.g. Wrong person checked in"') +
      '<div id="cMsg"></div>' +
      '<button class="btn danger" id="cGo" type="button">Cancel this check-in</button>' +
      '<button class="btn secondary" id="cClose" type="button">Keep it</button>');
    segBind($('cDay'));
    $('cClose').onclick = closeSheet;
    $('cGo').onclick = function () {
      if (S.busy) return;
      var dayText = segValue('cDay'), why = $('cWhy').value.trim();
      if (!dayText) return msg('cMsg', 'err', 'Choose which day\'s check-in to cancel.');
      if (!why) return msg('cMsg', 'err', 'Say why it is being cancelled.');
      busy('cGo', 'Saving – this can take a few seconds…');
      call('checkinCancel', [S.cluster, S.pin, S.day, p.id, Number(digits(dayText)), why, S.trainer], function (r) {
        done('cGo', 'Cancel this check-in');
        if (!r || !r.ok) return msg('cMsg', 'err', (r && r.message) || 'Not saved.');
        closeSheet();
        S.people = r.participants || S.people;
        if (!r.applied) { msg('flash', 'warn', r.result); render(); return; }
        var still = S.people.some(function (x) { return x.id === p.id; });
        msg('flash', 'ok', p.name + ': ' + dayText + ' check-in cancelled.' + (still ? '' : ' They have no other check-ins, so they are no longer on the register.'));
        render();
      }, function (e) { done('cGo', 'Cancel this check-in'); msg('cMsg', 'err', 'Not saved: ' + e); });
    };
  }
})();
</script>
</body>
</html>
